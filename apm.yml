name: synapse
namespace: synapse-framework
version: 1.1.0
description: "High-throughput, memory-driven multi-agent framework featuring modular workflows, strict execution guardrails, and persistent context."
license: MIT
author: synapse-framework
repository: https://github.com/synapse-framework/synapse

targets:
  - antigravity
  - agent-skills
  - claude
  - cursor
  - copilot
  - gemini

entrypoints:
  init: skills/synapse-init/SKILL.md
  resume: skills/resume/SKILL.md
  handoff: skills/handoff/SKILL.md

primitives:
  instructions: instructions
  skills: skills
  agents: agents
  hooks: hooks.json
  mcp: mcp.json.template

keywords:
  - agent-package
  - multi-agent
  - workflow-orchestration
  - guardrails
  - memory-management
  - persistent-context
  - antigravity
  - claude-code
  - cursor
  - github-copilot
  - gemini-cli
  - agent-skills
  - apm
  - system-instructions
